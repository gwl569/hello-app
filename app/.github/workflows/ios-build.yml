name: Build iOS (unsigned ipa)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps + add iOS platform
        run: |
          npm install
          npx cap add ios || true
          npx cap sync ios

      - name: Build (no code signing)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App \
            -sdk iphoneos -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned ipa
        run: |
          mkdir -p Payload
          cp -R ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry Hello-unsigned.ipa Payload
          ls -lh Hello-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Hello-unsigned-ipa
          path: app/Hello-unsigned.ipa
